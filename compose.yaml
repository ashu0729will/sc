services:
  mysql:
    image: mysql:8.4
    container_name: mori-shop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mori_shop
      MYSQL_USER: mori
      MYSQL_PASSWORD: mori_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mori-shop-mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mori-shop-mysql:
